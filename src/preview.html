<!doctype html>
<meta charset="utf-8">
<title>Mi Band 10 Binary Dot Clock Lua + Date Tap preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #202020; }
  .band { width: 212px; height: 520px; display: grid; place-items: center; background: #000; border-radius: 28px; }
  .clock { display: flex; align-items: center; gap: 3px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #151515; }
  .dot.on { background: #fff; }
  .gap { width: 9px; }
  .date-view { width: 100%; height: 100%; display: none; place-items: center; align-content: center; gap: 24px; color: #fff; font-family: "Hiragino Sans", "Apple SD Gothic Neo", sans-serif; text-align: center; }
  .date-view.visible { display: grid; }
  .date { font-size: 52px; line-height: 1; }
  .weekday { font-size: 72px; line-height: 1; }
</style>
<main class="band" aria-label="Binary dot clock preview">
  <div class="clock" id="clock"></div>
  <div class="date-view" id="date-view">
    <div class="date" id="date"></div>
    <div class="weekday" id="weekday"></div>
  </div>
</main>
<script>
  const clock = document.querySelector('#clock');
  const dateView = document.querySelector('#date-view');
  const date = document.querySelector('#date');
  const weekday = document.querySelector('#weekday');
  let showingDate = false;
  const bits = (value, width) => Array.from({length: width}, (_, i) => (value >> i) & 1);
  function dot(on) {
    const el = document.createElement('i');
    el.className = `dot${on ? ' on' : ''}`;
    return el;
  }
  function gap() {
    const el = document.createElement('i');
    el.className = 'gap';
    return el;
  }
  function render() {
    const now = new Date();
    const hour24 = now.getHours();
    const hour12 = hour24 % 12 || 12;
    if (!showingDate) {
      clock.replaceChildren(dot(hour24 >= 12), gap(), ...bits(hour12, 4).map(dot), gap(), ...bits(now.getMinutes(), 6).map(dot));
    }
    date.textContent = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
    weekday.textContent = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'][now.getDay()];
  }
  document.querySelector('.band').addEventListener('click', () => {
    showingDate = !showingDate;
    clock.style.display = showingDate ? 'none' : 'flex';
    dateView.classList.toggle('visible', showingDate);
    render();
  });
  render();
  setInterval(render, 1000);
</script>
