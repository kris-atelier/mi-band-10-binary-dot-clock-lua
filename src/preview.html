<!doctype html>
<meta charset="utf-8">
<title>Mi Band 10 Binary Dot Clock Lua preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #202020; }
  .band { width: 212px; height: 520px; display: grid; place-items: center; background: #000; border-radius: 28px; }
  .clock { display: flex; align-items: center; gap: 3px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #151515; }
  .dot.on { background: #fff; }
  .gap { width: 9px; }
</style>
<main class="band" aria-label="Binary dot clock preview">
  <div class="clock" id="clock"></div>
</main>
<script>
  const clock = document.querySelector('#clock');
  const bits = (value, width) => Array.from({length: width}, (_, i) => (value >> i) & 1);
  function dot(on) {
    const el = document.createElement('i');
    el.className = `dot${on ? ' on' : ''}`;
    return el;
  }
  function gap() {
    const el = document.createElement('i');
    el.className = 'gap';
    return el;
  }
  function render() {
    const now = new Date();
    const hour24 = now.getHours();
    const hour12 = hour24 % 12 || 12;
    clock.replaceChildren(dot(hour24 >= 12), gap(), ...bits(hour12, 4).map(dot), gap(), ...bits(now.getMinutes(), 6).map(dot));
  }
  render();
  setInterval(render, 1000);
</script>
